plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Установка кодировки для компиляции
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Установка кодировки для обработки ресурсов
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Appium Java Client
    testImplementation "io.appium:java-client:9.3.0"
    
    // JUnit 5
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // SLF4J for logging
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
    testImplementation 'ch.qos.logback:logback-classic:1.5.12'
}

test {
    useJUnitPlatform()
    
    // Принудительная кодировка для JVM тестов
    systemProperty "file.encoding", "UTF-8"
    systemProperty "sun.stdout.encoding", "UTF-8"
    systemProperty "sun.stderr.encoding", "UTF-8"
    
    testLogging {
        // Добавляем вывод названий тестов и событий
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}
